# Paper d9-union model. Self-contained; edit DATA paths before use.
DATA:
  test:
    angle:
    - 180
    - 180
    - 180
    batch_size: 1
    camera_convention: legacy_blender
    depth: 9
    disable: false
    distort: false
    filelist: data/objaverse/manifests/val.txt
    flip:
    - 0.0
    - 0.0
    - 0.0
    full_depth: 4
    image_height: 512
    image_width: 512
    interval:
    - 1
    - 1
    - 1
    jitter: 0.0
    location: data/objaverse/images
    name: ''
    normal_source: png
    num_workers: 1
    object_cache_size: 8
    occupancy_max_cells: 900000
    occupancy_root: data/objaverse/occupancy_d9
    octree_cache_size: 1
    orbit_up_axis: z
    orient_normal: ''
    pin_memory: true
    point_scale: 0.99
    pointcloud_root: data/objaverse/pointcloud
    q_depth: 7
    ray_scale: 0.5
    sample_cache_size: 1
    scale: 0.0
    shuffle: false
    take: -1
    uniform: false
  train:
    angle:
    - 180
    - 180
    - 180
    batch_size: 1
    camera_convention: legacy_blender
    depth: 9
    disable: false
    distort: false
    filelist: data/objaverse/manifests/train.txt
    flip:
    - 0.0
    - 0.0
    - 0.0
    full_depth: 4
    image_height: 512
    image_width: 512
    interval:
    - 1
    - 1
    - 1
    jitter: 0.0
    location: data/objaverse/images
    name: ''
    normal_source: png
    num_workers: 1
    object_cache_size: 8
    occupancy_max_cells: 900000
    occupancy_root: data/objaverse/occupancy_d9
    octree_cache_size: 1
    orbit_up_axis: z
    orient_normal: ''
    pin_memory: true
    point_scale: 0.99
    pointcloud_root: data/objaverse/pointcloud
    q_depth: 7
    ray_scale: 0.5
    sample_cache_size: 1
    scale: 0.0
    shuffle: true
    take: -1
    uniform: false
LOSS:
  color_detail_scale: 2.0
  color_detail_weight_scale: 1.0
  color_gradient: 0.2
  color_laplacian: 0.0
  color_loss_mode: charbonnier
  color_rarity_weight_scale: 1.0
  color_weight: 2.0
  constancy: 0.1
  detail_weight_scale: 4.0
  final_stage_weight: 0.5
  focal_gamma: 1.5
  hit_boundary: 0.2
  hit_boundary_f1: 0.0
  hit_floater: 0.1
  hit_floater_hard: 0.0
  hit_hole: 0.1
  hit_loss_mode: balanced_bce
  hit_positive_weight: 1.5
  hit_tversky: 0.2
  hit_tversky_alpha: 0.3
  hit_tversky_beta: 0.7
  hit_tversky_gamma: 1.0
  masked_color_ssim: true
  masked_normal_ssim: true
  name: ''
  normal_cosine_weight: 0.1
  normal_detail_scale: 4.0
  normal_gradient: 0.3
  normal_multiscale: 0.0
  parameter_l1: 0.0
  parameter_l2: 0.001
  positive_geometry: true
  ray_distance: 0.5
  smoothness: 0.0
  ssim_color: 0.5
  ssim_normal: 0.3
  stage_weight_mode: final_emphasis
MODEL:
  activation_checkpointing: true
  channel: 9
  color_skip_weight: 0.9
  feature: LPF
  find_unused_parameters: false
  forward_chunk_size: 65536
  freeze_batch_norm: false
  material_fp32: true
  name: ''
  nempty: false
  norm_groups: 8
  norm_type: rmsnorm
  q_depth: 7
  renderer_hidden_dim: 128
  renderer_iterations: 4
  segment_position: true
  sync_bn: false
  use_checkpoint: false
  use_vae: false
  voxel_feature_dim: 8
  sampling_mode: recurrent
RENDER:
  background_color:
  - 1.0
  - 1.0
  - 1.0
  hit_threshold: 0.4
  max_batch_size: 262144
  reconstruction_path: ''
  video_views: 120
SOLVER:
  alias: ''
  best_val: max:selection_score
  checkpoint_every_iter: 4000
  checkpoint_validation_batches: 128
  ckpt: ''
  ckpt_num: 8
  clip_grad: 1.0
  ddp_mode: spawn
  empty_cache: 0
  eval_epoch: 1
  eval_step: -1
  gamma: 0.1
  gpu:
  - 0
  - 1
  - 2
  - 3
  legacy_source_root: ''
  log_per_iter: 100
  logdir: outputs/feedforward
  lr: 2.5e-05
  lr_min: 0.0
  lr_power: 0.9
  lr_type: constant
  max_epoch: 3
  milestones:
  - 120
  - 180
  output_dir: outputs/feedforward/renders
  port: 26941
  progress_bar: true
  rand_seed: 20260901
  run: train
  save_video: false
  test_every_epoch: 1
  tf32: true
  type: adamw
  use_amp: true
  validate_each_checkpoint: true
  warmup_epoch: 20
  warmup_init: 0.001
  weight_decay: 0.0001
  zero_grad_to_none: true
